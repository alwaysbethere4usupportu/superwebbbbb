<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>如果你也在陪伴的路上，不是只有你一個人｜讓我們為你撐腰</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F1ED;--bg-alt:#F0E5DE;--ink:#353848;--ink-soft:#7B7E88;--ochre:#D09E88;--ochre-deep:#B18674;--brick:#353848;--cream-line:#8B8687;--paper:#FFFFFF;--max:1080px;}
*{box-sizing:border-box;}html{scroll-behavior:smooth;}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif;line-height:1.85;}
h1,h2,h3{font-family:'Noto Serif TC',serif;color:var(--ink);line-height:1.4;margin:0;}a{color:inherit;}
.wrap{max-width:var(--max);margin:0 auto;padding:0 28px;}
header.site-nav{position:sticky;top:0;z-index:50;background:rgba(247,241,237,0.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--cream-line);}
.nav-inner{max-width:var(--max);margin:0 auto;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.brand{font-family:'Noto Serif TC',serif;font-weight:700;font-size:1.05rem;text-decoration:none;}
nav.links{display:flex;gap:26px;}nav.links a{text-decoration:none;font-size:0.96rem;color:var(--ink-soft);padding:4px 2px;border-bottom:2px solid transparent;}
nav.links a:hover{color:var(--brick);border-color:var(--ochre);}
.page-hero{padding:80px 0 40px;}.page-hero .kicker{color:var(--brick);font-size:0.95rem;margin-bottom:12px;display:block;}
.page-hero h1{font-size:clamp(1.7rem,3.2vw,2.3rem);font-weight:600;margin-bottom:18px;}.page-hero p{color:var(--ink-soft);max-width:42em;margin:0;}
.content-section{padding:20px 0 100px;}
.placeholder-card{background:var(--paper);border:1px solid var(--cream-line);border-radius:8px;padding:48px 42px;text-align:center;}.placeholder-card p{color:var(--ink-soft);margin:0;}
.org-card{background:var(--paper);border:1px solid var(--cream-line);border-radius:8px;padding:40px 42px;margin-bottom:32px;}
.org-card h2{font-size:1.25rem;font-weight:600;margin-bottom:16px;}
.org-card p{color:var(--ink-soft);margin:0 0 20px;text-align:justify;}
.org-link{display:inline-block;color:var(--brick);font-size:0.93rem;text-decoration:none;border-bottom:1px solid var(--brick);}
.region-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;}
@media (max-width:700px){.region-grid{grid-template-columns:1fr;}}
.region-card{background:var(--paper);border:1px solid var(--cream-line);border-radius:10px;padding:32px 30px;display:flex;flex-direction:column;}
.region-card h2{font-size:1.28rem;font-weight:600;margin-bottom:14px;}
.region-card .city-list{color:var(--ink-soft);font-size:0.94rem;line-height:1.75;margin:0 0 22px;flex-grow:1;}
.region-card .city-list span{display:inline-block;margin-right:10px;}
.region-link{display:inline-block;font-size:0.93rem;color:var(--brick);text-decoration:none;border-bottom:1px solid var(--brick);}
.back-row{margin-top:48px;display:flex;gap:16px;flex-wrap:wrap;}
.btn{display:inline-block;padding:12px 26px;border-radius:6px;font-size:0.95rem;text-decoration:none;font-weight:500;border:1px solid var(--cream-line);background:transparent;color:var(--ink);}
.btn:hover{background:var(--bg-alt);}
footer{background:var(--ink);color:#C7BDBB;padding:26px 0 40px;font-size:0.85rem;}
</style>
</head>
<body>

<header class="site-nav">
  <div class="nav-inner">
    <a href="index.html" class="brand">讓我們為你撐腰</a>
    <nav class="links">
      <a href="index.html#origin">緣起</a>
      <a href="index.html#resources">資源盤點</a>
      <a href="index.html#articles">文章</a>
      <a href="index.html#contact">聯絡我們</a>
    </nav>
  </div>
</header>

<section class="page-hero">
  <div class="wrap">
    <span class="kicker">即將發布</span>
    <h1>如果你也在陪伴的路上，不是只有你一個人</h1>
    <p>寫給正在經歷相似處境的大學生，關於同儕支持的重要性。</p>
  </div>
</section>
<section class="content-section">
  <div class="wrap">
    <div class="placeholder-card"><p>內容建置中，敬請期待。</p></div>
    <div class="back-row">
      <a href="index.html#articles" class="btn">← 返回相關文章</a>
    </div>
  </div>
</section>
<footer>
  <div class="wrap">國立臺灣師範大學・大學生身心障礙家庭陪伴者支持資源行動計畫</div>
</footer>
</body>
</html>
